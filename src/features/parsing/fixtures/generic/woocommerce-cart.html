<!DOCTYPE html>
<html lang="en-US">
<head><meta charset="UTF-8"><title>Cart &#8211; Trailhead Outfitters</title>
<style id="woocommerce-inline-inline-css">.woocommerce-order-overview{margin:0}.woocommerce form .form-row .required{visibility:visible}</style>
</head>
<body class="page-template-default page woocommerce-cart woocommerce-page woocommerce-js">
<div class="woocommerce">
<form class="woocommerce-cart-form" action="https://trailhead.example.com/cart/" method="post">
<table class="shop_table shop_table_responsive cart woocommerce-cart-form__contents" cellspacing="0">
<thead><tr><th class="product-remove"><span class="screen-reader-text">Remove item</span></th><th class="product-thumbnail"><span class="screen-reader-text">Thumbnail image</span></th><th class="product-name">Product</th><th class="product-price">Price</th><th class="product-quantity">Quantity</th><th class="product-subtotal">Subtotal</th></tr></thead>
<tbody>
<tr class="woocommerce-cart-form__cart-item cart_item">
<td class="product-remove"><a href="https://trailhead.example.com/cart/?remove_item=abc&#038;_wpnonce=123" class="remove" aria-label="Remove Ultralight Tent 2P from cart">&times;</a></td>
<td class="product-thumbnail"><a href="https://trailhead.example.com/product/ultralight-tent-2p/"><img width="324" height="324" src="https://trailhead.example.com/wp-content/uploads/tent-324x324.jpg" alt=""></a></td>
<td class="product-name" data-title="Product"><a href="https://trailhead.example.com/product/ultralight-tent-2p/">Ultralight Tent 2P</a></td>
<td class="product-price" data-title="Price"><span class="woocommerce-Price-amount amount"><bdi><span class="woocommerce-Price-currencySymbol">&#36;</span>289.00</bdi></span></td>
<td class="product-quantity" data-title="Quantity"><div class="quantity"><input type="number" class="input-text qty text" name="cart[abc][qty]" value="1" min="0"></div></td>
<td class="product-subtotal" data-title="Subtotal"><span class="woocommerce-Price-amount amount"><bdi><span class="woocommerce-Price-currencySymbol">&#36;</span>289.00</bdi></span></td>
</tr>
</tbody>
</table>
</form>
<div class="cart-collaterals"><div class="cart_totals "><h2>Cart totals</h2>
<table cellspacing="0" class="shop_table shop_table_responsive">
<tr class="cart-subtotal"><th>Subtotal</th><td data-title="Subtotal"><span class="woocommerce-Price-amount amount"><bdi><span class="woocommerce-Price-currencySymbol">&#36;</span>289.00</bdi></span></td></tr>
<tr class="order-total"><th>Total</th><td data-title="Total"><strong><span class="woocommerce-Price-amount amount"><bdi><span class="woocommerce-Price-currencySymbol">&#36;</span>289.00</bdi></span></strong></td></tr>
</table>
<div class="wc-proceed-to-checkout"><a href="https://trailhead.example.com/checkout/" class="checkout-button button alt wc-forward">Proceed to checkout</a></div>
</div></div>
</div>
</body>
</html>
