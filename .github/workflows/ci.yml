name: Verify application
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun install --cwd extension --frozen-lockfile
      - run: bun audit && bun audit --cwd extension
      - run: bun run lint && bun run typecheck
      - run: bun run test
        env:
          TEST_DATABASE_URL: postgresql://test:local-ci-only@127.0.0.1:5432/test
      - run: bun run --cwd extension typecheck && bun run --cwd extension test
      - run: bun run extension:package
      - run: bun run build:runtime
      - run: bunx playwright install --with-deps chromium
      - run: bun run demo:setup
      - name: Synthetic browser flows and screenshots
        run: |
          bun run demo:start > /tmp/ledgercatch-demo.log 2>&1 &
          for n in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4300/api/health > /dev/null; then break; fi
            sleep 2
          done
          bun run demo:screenshots
          E2E_BASE_URL=http://127.0.0.1:4300 bunx playwright test e2e/smoke.e2e.ts --workers=1
      - run: bun scripts/privacy-scan.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-inputs
          path: |
            artifacts/*
            docs/images/*.png
      - name: Stop only the synthetic demo
        if: always()
        run: docker compose --env-file .demo/env -f compose.demo.yaml down --volumes
  container:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs
          path: .
      - run: bun install --frozen-lockfile
      - run: |
          mkdir -p public/downloads
          cp artifacts/ledgercatch-extension-*.zip public/downloads/ledgercatch-extension.zip
          cd artifacts && sha256sum -c SHA256SUMS
      - run: sha256sum public/downloads/ledgercatch-extension.zip | sed 's@public/downloads/@@' > public/downloads/SHA256SUMS
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ledgercatch:verify
          platforms: linux/amd64
      - run: bun scripts/container-smoke.ts
        env:
          VERIFY_IMAGE: ledgercatch:verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-verification
          path: artifacts/container-verification.json
