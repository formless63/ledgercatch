name: Optional Chrome Web Store upload
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of an existing verified GitHub release
        required: true
        type: string
      submit:
        description: Submit for staged review after successful upload
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: chrome-store
  cancel-in-progress: false
jobs:
  configured:
    runs-on: ubuntu-24.04
    steps:
      - name: Optional account status
        env:
          PUBLISHER: ${{ vars.CWS_PUBLISHER_ID }}
        run: |
          if [ -z "$PUBLISHER" ]; then
            printf 'Store publisher not configured. App and extension builds remain available.\n'
          fi
  upload:
    if: vars.CWS_PUBLISHER_ID != '' && github.ref == 'refs/heads/main'
    environment: chrome-store
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Download verified release bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p artifacts
          gh release download "v$VERSION" --pattern "ledgercatch-extension-$VERSION.zip" --pattern SHA256SUMS --dir artifacts
      - name: Upload and record actual state
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE_VERSION: ${{ inputs.version }}
          CWS_SUBMIT: ${{ inputs.submit }}
        run: bun scripts/store-publish.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chrome-store-status
          path: artifacts/store-*.json
