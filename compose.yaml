name: ledgercatch
x-app: &app
  image: ${APP_IMAGE:-ledgercatch:local}
  env_file: ${APP_ENV_FILE:-.env}
  environment:
    DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ledger
    STORAGE_ENDPOINT: http://storage:9000
    STORAGE_FORCE_PATH_STYLE: "true"
  restart: "no"
services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ledger
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ledger -d ledger"]
      interval: 3s
      retries: 30
    restart: unless-stopped
  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes: [objects:/data, object-logs:/logs]
    restart: unless-stopped
  migrate:
    <<: *app
    command: [node, .output/migrate.mjs]
    depends_on:
      postgres: {condition: service_healthy}
  jobs-migrate:
    <<: *app
    command: [node, .output/jobs-migrate.mjs]
    depends_on:
      migrate: {condition: service_completed_successfully}
  storage-init:
    <<: *app
    command: [node, .output/storage-init.mjs]
    depends_on:
      storage: {condition: service_started}
  app:
    <<: *app
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"]
    restart: unless-stopped
    depends_on:
      jobs-migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      start_period: 30s
      retries: 6
  worker:
    <<: *app
    command: [node, .output/jobs-worker.mjs]
    restart: unless-stopped
    depends_on:
      jobs-migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
volumes:
  database:
  objects:
  object-logs:
